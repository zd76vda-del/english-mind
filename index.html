<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="المنصة الصوتية لسلسلة العقل الإنجليزي — أكاديمية أيهم: استمع لكل كلمة، اختبر نفسك، ودرّب نطقك.">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>العقل الإنجليزي | The English Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lato:wght@400;700;900&family=Poppins:wght@800&display=swap">
<style>
/* Layout: a pocket listening companion — brand bar, level "book spines", 30-day grid, then a day sheet with a sticky player */
:root {
  --bg: #F4F5F8; --surface: #FFFFFF; --surface-2: #ECEEF3; --ink: #141821; --mute: #5A6374; --line: #DFE3EA;
  --deep: #0B4F4A; --accent: #FF7A59; --soft: rgba(255,122,89,.14); --on-deep: #FFFFFF; --on-deep-mute: rgba(255,255,255,.72);
  --f-ar: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --f-en: 'Lato', 'Helvetica Neue', Arial, sans-serif;
  --f-disp: 'Poppins', 'Lato', Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1116; --surface: #161A22; --surface-2: #1F2430; --ink: #E8EBF1; --mute: #A3ABBA; --line: #2A303C; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0E1116; --surface: #161A22; --surface-2: #1F2430; --ink: #E8EBF1; --mute: #A3ABBA; --line: #2A303C; color-scheme: dark }
[data-level="a1"] { --deep: #0F2A4A; --accent: #F2B705; --soft: rgba(242,183,5,.17); }
[data-level="a2"] { --deep: #0B4F4A; --accent: #FF7A59; --soft: rgba(255,122,89,.15); }
[data-level="b1"] { --deep: #5B1530; --accent: #D9A441; --soft: rgba(217,164,65,.17); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ar); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[dir="ltr"], .en { font-family: var(--f-en); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: inherit; }

/* brand bar */
.bar { background: var(--deep); color: var(--on-deep); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand img { width: 42px; height: 42px; border-radius: 50%; background: #fff; padding: 4px; box-shadow: 0 0 0 2px var(--accent); }
.brand b { display: block; font-size: 16px; line-height: 1.2; }
.brand span { display: block; font-family: var(--f-en); font-size: 11px; letter-spacing: .14em; color: var(--on-deep-mute); }
.prefs { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: rgba(255,255,255,.10); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--on-deep); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #141821; font-weight: 700; }

main { padding-block: 22px 110px; }
.hero h1 { font-size: clamp(24px, 5vw, 34px); line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
.hero p { margin: 0; color: var(--mute); max-width: 62ch; }
.notice { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 14px; color: var(--mute); }

/* level spines */
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 20px; }
.lvl { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: start; border: 0; border-radius: var(--r); padding: 18px 18px 16px; background: var(--deep); color: var(--on-deep); min-height: 150px; overflow: hidden; }
.lvl .code { font-family: var(--f-disp); font-weight: 800; font-size: 44px; line-height: 1; color: var(--accent); direction: ltr; text-align: right; }
.lvl b { font-size: 18px; }
.lvl small { color: var(--on-deep-mute); font-size: 13px; }
.lvl .meta { margin-top: auto; font-size: 13px; display: flex; justify-content: space-between; color: var(--on-deep-mute); }
.lvl[disabled] { cursor: default; opacity: .78; }
.lvl[disabled] .meta em { font-style: normal; background: rgba(255,255,255,.14); color: var(--on-deep); padding: 1px 10px; border-radius: 999px; }
.lvl:not([disabled]):hover { transform: translateY(-2px); transition: transform .15s; }

.how { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.how div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
.how b { display: block; color: var(--ink); }
.how span { color: var(--mute); }

/* level page */
.band { background: var(--deep); color: var(--on-deep); border-radius: var(--r); padding: 16px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.band .code { font-family: var(--f-disp); font-weight: 800; font-size: 40px; color: var(--accent); line-height: 1; }
.band h2 { margin: 0; font-size: 20px; }
.band p { margin: 0; color: var(--on-deep-mute); font-size: 14px; }
.crumbs { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 14px; color: var(--mute); flex-wrap: wrap; }
.crumbs a { text-decoration: none; color: var(--mute); }
.crumbs a:hover { color: var(--ink); }
.search { margin: 16px 0 8px; display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.day { text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.day .n { font-family: var(--f-en); font-weight: 900; font-size: 13px; color: var(--accent); }
.day .t { font-size: 14px; line-height: 1.35; }
.day .e { font-family: var(--f-en); font-size: 12px; color: var(--mute); }
.day:hover { border-color: var(--accent); }
.day.last { box-shadow: inset 0 0 0 2px var(--accent); }
.results { margin-top: 10px; }

/* day sheet */
.dhead { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.dhead .num { background: var(--accent); color: #141821; border-radius: 12px; padding: 6px 12px; text-align: center; font-family: var(--f-en); }
.dhead .num small { display: block; font-size: 11px; font-weight: 900; letter-spacing: .14em; }
.dhead .num b { display: block; font-size: 28px; font-weight: 900; line-height: 1; }
.dhead h2 { margin: 0; font-size: 24px; line-height: 1.3; text-wrap: balance; }
.dhead .en { color: var(--mute); font-size: 15px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; }
.btn.primary { background: var(--deep); color: var(--on-deep); border-color: var(--deep); }
.btn svg { width: 18px; height: 18px; flex: none; }
.navd { display: flex; justify-content: space-between; gap: 8px; margin-top: 26px; }

section.blk { margin-top: 22px; }
.blk > h3 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; font-size: 18px; }
.blk > h3 .en { font-size: 14px; color: var(--mute); font-weight: 400; }
.blk > h3 .cnt { margin-inline-start: auto; font-family: var(--f-en); font-size: 12px; color: var(--mute); font-weight: 700; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: start; }
.row:first-child { border-top: 0; }
.row.on { background: var(--soft); box-shadow: inset -4px 0 0 var(--accent); }
.plays { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 0; }
.play svg { width: 16px; height: 16px; }
.play.s { width: 28px; height: 28px; margin-inline-start: 3px; }
.play.s svg { width: 13px; height: 13px; }
.play:hover { border-color: var(--accent); }
.txt { min-width: 0; }
.wline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; direction: ltr; justify-content: flex-start; }
.w { font-family: var(--f-en); font-weight: 900; font-size: 18px; }
.m { font-family: var(--f-ar); color: var(--mute); font-size: 15px; direction: rtl; }
.sent { direction: ltr; text-align: left; font-family: var(--f-en); font-size: 15px; margin-top: 2px; }
.df { direction: ltr; text-align: left; font-family: var(--f-en); font-style: italic; font-size: 13px; color: var(--mute); margin-top: 1px; }
.gist { margin: 10px 0 0; padding: 10px 14px; border: 1px dashed var(--accent); border-radius: var(--r); font-size: 14px; line-height: 1.7; color: var(--ink, inherit); }
.gist b { color: var(--accent); }
.tr { color: var(--mute); font-size: 14px; margin-top: 1px; }
.phrase { background: var(--deep); color: var(--on-deep); border-radius: var(--r); padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
.phrase .p { font-family: var(--f-en); font-weight: 900; font-size: 20px; direction: ltr; text-align: left; color: var(--accent); }
.phrase .tr { color: var(--on-deep-mute); }
.phrase .play { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: var(--on-deep); }
.dlg .row .sp { font-family: var(--f-en); font-weight: 900; font-size: 13px; color: var(--accent); direction: ltr; text-align: left; }
.reading { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.reading p.rt { direction: ltr; text-align: left; font-family: var(--f-en); font-size: 16px; line-height: 1.75; margin: 10px 0 0; max-width: 68ch; }
.reading .sen { border-radius: 4px; }
.reading .sen.on { background: var(--soft); }

/* player */
.player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; }
.player .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.player .now { flex: 1; min-width: 0; font-size: 14px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .now b { color: var(--ink); font-family: var(--f-en); }
.player[hidden] { display: none !important; }
.err { background: var(--soft); border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
.foot { margin-top: 40px; color: var(--mute); font-size: 13px; text-align: center; }
[data-level="b2"] { --deep: #2E1A47; --accent: #F2A93B; --soft: rgba(242,169,59,.17); }
:root { --good: #1E8F5A; --good-soft: rgba(30,143,90,.13); --bad: #C2412D; --bad-soft: rgba(194,65,45,.12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --good: #4CC38A; --good-soft: rgba(76,195,138,.16); --bad: #FF8A73; --bad-soft: rgba(255,138,115,.15); } }
:root[data-theme="dark"] { --good: #4CC38A; --good-soft: rgba(76,195,138,.16); --bad: #FF8A73; --bad-soft: rgba(255,138,115,.15); }
.why { margin-top: 4px; font-size: 13px; line-height: 1.6; color: var(--mute); border-inline-start: 3px solid var(--accent); padding-inline-start: 8px; }
.why b { color: var(--ink); }
.btn .best { font-family: var(--f-en); font-size: 12px; font-weight: 700; background: var(--soft); border-radius: 999px; padding: 1px 8px; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #141821; font-weight: 700; }
.review { margin-top: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.review div { flex: 1; min-width: 200px; }
.review b { display: block; }
.review span { color: var(--mute); font-size: 14px; }

/* quiz + speaking card */
.stage { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.prog { display: flex; align-items: center; gap: 10px; font-family: var(--f-en); font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.prog .bar2 { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.prog .bar2 i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.qk { margin: 16px 0 6px; color: var(--mute); font-size: 14px; }
.qbig { font-family: var(--f-en); font-weight: 900; font-size: clamp(24px, 6vw, 34px); line-height: 1.2; direction: ltr; text-align: left; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.qbig.ar { font-family: var(--f-ar); direction: rtl; text-align: right; font-weight: 700; }
.qsent { font-family: var(--f-en); font-size: 18px; line-height: 1.6; direction: ltr; text-align: left; }
.qsent u { text-decoration: none; border-bottom: 2px solid var(--accent); padding: 0 1.2em; }
.qdef { font-family: var(--f-en); font-style: italic; font-size: 18px; direction: ltr; text-align: left; }
.bigplay { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--deep); color: var(--on-deep); display: grid; place-items: center; }
.bigplay svg { width: 26px; height: 26px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 16px; }
.opt { text-align: start; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-height: 52px; }
.opt.en { font-family: var(--f-en); font-weight: 700; direction: ltr; text-align: left; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.fb { margin-top: 14px; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.fb.ok { background: var(--good-soft); } .fb.bad { background: var(--bad-soft); }
.fb .v { font-weight: 700; }
.fb.ok .v { color: var(--good); } .fb.bad .v { color: var(--bad); }
.stage .next { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.result { text-align: center; padding-block: 10px 4px; }
.result .sc { font-family: var(--f-disp); font-weight: 800; font-size: 56px; line-height: 1; color: var(--accent); direction: ltr; font-variant-numeric: tabular-nums; }
.result .stars { font-size: 26px; letter-spacing: 4px; color: var(--accent); margin-top: 6px; }
.result .stars s { text-decoration: none; color: var(--line); }
.result p { margin: 8px auto 0; max-width: 46ch; color: var(--mute); }
.ring { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-disp); font-weight: 800; font-size: 24px; direction: ltr; flex: none;
  background: conic-gradient(var(--ring-c, var(--accent)) calc(var(--p, 0) * 1%), var(--surface-2) 0); position: relative; }
.ring::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; z-index: 1; }
.heard { direction: ltr; text-align: left; font-family: var(--f-en); font-size: 16px; display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
.heard .hit { color: var(--good); font-weight: 700; } .heard .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.sres { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.sres > div { flex: 1; min-width: 200px; }
.micbtn { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--accent); color: #141821; display: grid; place-items: center; box-shadow: 0 0 0 6px var(--soft); }
.micbtn svg { width: 30px; height: 30px; }
.micbtn.rec { animation: pulse 1.1s infinite; background: var(--bad); color: #fff; }
@keyframes pulse { 50% { box-shadow: 0 0 0 14px var(--bad-soft); } }
.srow { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.hint { font-size: 14px; color: var(--mute); margin: 10px 0 0; }
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; margin-top: 12px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 14px; }
.tabs button[aria-pressed="true"] { background: var(--deep); color: var(--on-deep); }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.selfrate { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.mastery { font-family: var(--f-en); font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .micbtn.rec { animation: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .lvl:hover { transform: none; } }
@media (max-width: 480px) { .w { font-size: 17px; } .prefs { margin-inline-start: 0; width: 100%; } }
</style>
</head>
<body>

<div dir="rtl" id="app" data-level="a2">
  <header class="bar"><div class="wrap">
    <a class="brand" href="#" aria-label="الصفحة الرئيسية"><img src="logo.png" alt=""><div><b>العقل الإنجليزي</b><span>ENGLISH MIND · AUDIO</span></div></a>
    <div class="prefs">
      <div class="seg" role="group" aria-label="اللهجة"><button id="acc-us" data-acc="us">أمريكي</button><button id="acc-uk" data-acc="uk">بريطاني</button></div>
      <div class="seg" role="group" aria-label="السرعة"><button id="rate-slow" data-rate="0.72">بطيء</button><button id="rate-norm" data-rate="0.95">عادي</button></div>
    </div>
  </div></header>
  <main class="wrap" id="view" aria-live="polite"></main>
  <div class="player" id="player" hidden><div class="wrap">
    <div class="now" id="now"></div>
    <button class="btn primary" id="stop"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>إيقاف</button>
  </div></div>
</div>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('em-' + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('em-' + k, v); } catch (e) {} }
  };
  const ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  const ICON_ALL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h10M4 17h6"/><path d="M17 13v6l4-3z" fill="currentColor"/></svg>';
  const ICON_REP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>';

  const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  const ICON_QUIZ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>';
  const app = $('#app'), view = $('#view');

  /* ---------------- progress helpers (per-viewer, browser only) ---------------- */
  const today = () => new Date().toISOString().slice(0, 10);
  function visited(id) { return store.get('visited-' + id, '').split(',').filter(Boolean).map(Number); }
  function markVisited(id, n) { const v = visited(id); if (!v.includes(n)) { v.push(n); store.set('visited-' + id, v.join(',')); } }
  function bestRev(id) { const v = store.get(`rev-${id}-${today()}`, ''); return v === '' ? null : v; }
  function sayMap(id, n) { try { return JSON.parse(store.get(`say-${id}-${n}`, '{}')) || {}; } catch (e) { return {}; } }
  function mastery(id, n) { const m = sayMap(id, n); const k = Object.values(m).filter(v => v >= 85).length; return k ? `${k} ✓` : ''; }
  const hashStr = t => [...t].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  /* ---------------- quiz ---------------- */
  function gapOf(w) {
    if (/\b(sb|sth)\b|…/.test(w.w) || !w.s) return null;
    const re = new RegExp('(^|[^A-Za-z])(' + reEsc(w.w) + ')(?![A-Za-z])', 'i');
    const m = w.s.match(re); if (!m) return null;
    const i = m.index + m[1].length;
    return { before: w.s.slice(0, i), after: w.s.slice(i + m[2].length) };
  }
  function makeQuiz(words, pool, count, r) {
    const cycle = ['mean', 'listen', 'gap', 'word', 'def'];
    const off = Math.floor(r() * cycle.length);
    return shuffle(words, r).slice(0, count).map((w, i) => {
      let type = cycle[(i + off) % cycle.length];
      if (type === 'gap' && !gapOf(w)) type = 'mean';
      if (type === 'def' && !w.d) type = 'word';
      const ar = type === 'mean';
      const key = ar ? 'm' : 'w';
      const others = shuffle(pool.filter(x => x[key] !== w[key] && x.w.toLowerCase() !== w.w.toLowerCase()), r);
      const seen = new Set([w[key]]); const opts = [{ label: w[key], ok: true }];
      for (const o of others) { if (opts.length >= 4) break; if (!seen.has(o[key])) { seen.add(o[key]); opts.push({ label: o[key], ok: false }); } }
      return { w, type, ar, opts: shuffle(opts, r) };
    });
  }
  function qPrompt(q) {
    const w = q.w;
    if (q.type === 'mean') return `<p class="qk">ما معنى هذه الكلمة؟</p><div class="qbig"><span>${esc(w.w)}</span><button class="play" data-q-say aria-label="استمع">${ICON}</button></div>`;
    if (q.type === 'word') return `<p class="qk">اختر الكلمة الإنجليزية التي تعني:</p><div class="qbig ar">${esc(w.m)}</div>`;
    if (q.type === 'listen') return `<p class="qk">استمع واختر ما سمعته:</p><button class="bigplay" data-q-say aria-label="استمع مرة أخرى">${ICON}</button>`;
    if (q.type === 'gap') { const g = gapOf(w); return `<p class="qk">أكمل الجملة بالكلمة المناسبة:</p><p class="qsent">${esc(g.before)}<u>&nbsp;</u>${esc(g.after)}</p>`; }
    return `<p class="qk">أيّ كلمة يصفها هذا التعريف؟</p><p class="qdef">${esc(w.d)}</p>`;
  }
  function runQuiz(qs, ctx) {
    let i = 0, right = 0; const wrong = [];
    const show = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      view.querySelector('#stage').innerHTML = `
        <div class="prog"><span dir="ltr">${i + 1} / ${qs.length}</span><span class="bar2"><i style="width:${(i / qs.length) * 100}%"></i></span><span dir="ltr">✓ ${right}</span></div>
        ${qPrompt(q)}
        <div class="opts">${q.opts.map((o, k) => `<button class="opt${q.ar ? '' : ' en'}" data-k="${k}">${esc(o.label)}</button>`).join('')}</div>
        <div id="fb"></div>`;
      const sayIt = () => play([{ text: q.w.w, label: 'الاختبار' }]);
      view.querySelectorAll('[data-q-say]').forEach(b => b.addEventListener('click', sayIt));
      if (q.type === 'listen') sayIt();
      view.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
        const o = q.opts[+b.dataset.k];
        view.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (q.opts[+x.dataset.k].ok) x.classList.add('ok'); });
        if (o.ok) right++; else { b.classList.add('bad'); wrong.push(q.w); }
        $('#fb').innerHTML = `<div class="fb ${o.ok ? 'ok' : 'bad'}"><button class="play" id="fbp" aria-label="استمع للجملة">${ICON}</button><div class="txt">
          <div class="v">${o.ok ? 'إجابة صحيحة' : 'الإجابة الصحيحة: <span dir="ltr">' + esc(q.ar ? q.w.m : q.w.w) + '</span>'}</div>
          <div class="wline"><span class="w" style="font-size:16px">${esc(q.w.w)}</span><span class="m">${esc(q.w.m)}</span></div><div class="sent">${esc(q.w.s)}</div></div></div>
          <div class="next"><button class="btn primary" id="nx">${i + 1 < qs.length ? 'السؤال التالي' : 'النتيجة'}</button></div>`;
        $('#fbp').addEventListener('click', () => play([{ text: q.w.s }]));
        $('#nx').addEventListener('click', () => { i++; stop(); show(); }); $('#nx').focus();
      }));
    };
    const finish = () => {
      const pct = right / qs.length, stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .5 ? 1 : 0;
      const msg = ['راجع كلمات اليوم واستمع لها مرة أخرى، ثم أعد الاختبار.', 'بداية جيدة. ركّز على الكلمات التي أخطأت فيها.', 'أداء جيد جداً! راجع أخطاءك القليلة.', 'ممتاز! أنت تتقن كلمات هذا اليوم.'][stars];
      ctx.save(right, qs.length);
      view.querySelector('#stage').innerHTML = `
        <div class="result"><div class="sc">${right}/${qs.length}</div><div class="stars" aria-label="${stars} من 3">${'★'.repeat(stars)}<s>${'★'.repeat(3 - stars)}</s></div><p>${msg}</p></div>
        ${wrong.length ? `<h3 style="margin:18px 0 8px;font-size:16px">كلمات تحتاج مراجعة</h3><div class="list">${wrong.map(w => wordRow(w)).join('')}</div>` : ''}
        <div class="next">${wrong.length ? '<button class="btn accent" id="again">أعد الأسئلة التي أخطأت فيها</button>' : ''}<button class="btn" id="fresh">اختبار جديد</button><a class="btn primary" href="${ctx.back}">${esc(ctx.backLabel)}</a></div>`;
      bindRows(view.querySelector('#stage'));
      if (wrong.length) $('#again').addEventListener('click', () => { const r = rng(Date.now()); runQuiz(makeQuiz(wrong, ctx.pool, wrong.length, r), ctx); });
      $('#fresh').addEventListener('click', () => { const r = rng(Date.now()); runQuiz(makeQuiz(ctx.words, ctx.pool, Math.min(10, ctx.words.length), r), ctx); });
    };
    show();
  }
  async function quizView(id, n) {
    const L = await level(id); if (!L) { location.hash = ''; return; }
    const d = L.days.find(x => x.n === n); if (!d) { location.hash = id; return; }
    app.dataset.level = id; markVisited(id, n);
    const words = d.groups.flatMap(g => g.words), pool = L.days.flatMap(x => x.groups.flatMap(g => g.words));
    const best = store.get(`quiz-${id}-${n}`, '');
    view.innerHTML = `
      <div class="crumbs"><a href="#">الرئيسية</a><span>›</span><a href="#${id}">${esc(L.meta.name)}</a><span>›</span><a href="#${id}-d${pad(n)}">اليوم ${n}</a><span>›</span><span>الاختبار</span></div>
      <div class="dhead"><div class="num"><small>QUIZ</small><b>${pad(n)}</b></div><div><h2>اختبار اليوم: ${esc(d.ar)}</h2><div class="en" dir="ltr">10 questions · meaning, listening, gap-fill${best ? ' · best ' + esc(best) + '/10' : ''}</div></div></div>
      <div class="stage" id="stage"></div>`;
    window.scrollTo(0, 0);
    runQuiz(makeQuiz(words, words.length >= 12 ? words : pool, 10, rng(Date.now())), {
      words, pool: words, back: `#${id}-d${pad(n)}`, backLabel: 'العودة إلى اليوم',
      save: (r) => { const b = parseInt(store.get(`quiz-${id}-${n}`, '0'), 10) || 0; if (r > b) store.set(`quiz-${id}-${n}`, String(r)); }
    });
  }
  async function reviewView(id) {
    const L = await level(id); if (!L) { location.hash = ''; return; }
    app.dataset.level = id;
    let v = visited(id); if (!v.length) v = [1, 2, 3];
    const days = L.days.filter(d => v.includes(d.n));
    const words = days.flatMap(d => d.groups.flatMap(g => g.words)), pool = L.days.flatMap(x => x.groups.flatMap(g => g.words));
    const r = rng(hashStr(id + today()));
    view.innerHTML = `
      <div class="crumbs"><a href="#">الرئيسية</a><span>›</span><a href="#${id}">${esc(L.meta.name)}</a><span>›</span><span>مراجعة اليوم</span></div>
      <div class="dhead"><div class="num"><small>REVIEW</small><b dir="ltr">${new Date().getDate()}</b></div><div><h2>اختبار اليوم · مراجعة مختلطة</h2><div class="en" dir="ltr">${esc(L.code)} · ${days.length} day${days.length === 1 ? '' : 's'} · a new set every day</div></div></div>
      <div class="stage" id="stage"></div>`;
    window.scrollTo(0, 0);
    runQuiz(makeQuiz(words, pool, Math.min(10, words.length), r), {
      words, pool, back: `#${id}`, backLabel: 'العودة إلى المستوى',
      save: (s) => { const k = `rev-${id}-${today()}`; const b = parseInt(store.get(k, '-1'), 10); if (s > b) store.set(k, String(s)); }
    });
  }

  /* ---------------- pronunciation ---------------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let micStream = null, micMode = SR ? 'unknown' : 'fallback', recog = null;
  function closeMic() { try { if (recog) recog.abort(); } catch (e) {} recog = null; if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; } }
  async function ensureMic() {
    if (micMode !== 'unknown') return micMode;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return (micMode = 'fallback');
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); return (micMode = 'live'); } catch (e) { return (micMode = 'fallback'); }
  }
  const norm = t => t.toLowerCase().replace(/[’‘]/g, "'").replace(/\bsb's\b/g, "someone's").replace(/\bsb\b/g, 'someone').replace(/\bsth\b/g, 'something')
    .replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  function lev(a, b) { const m = a.length, n = b.length; if (!m || !n) return Math.max(m, n); let p = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
  const same = (a, b) => a === b || (a.length > 4 && lev(a, b) <= 1);
  function scoreOne(target, heard) {
    const T = norm(target).split(' ').filter(Boolean), H = norm(heard).split(' ').filter(Boolean);
    const dp = Array.from({ length: T.length + 1 }, () => new Array(H.length + 1).fill(0));
    for (let i = 1; i <= T.length; i++) for (let j = 1; j <= H.length; j++) dp[i][j] = same(T[i - 1], H[j - 1]) ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
    const flags = new Array(T.length).fill(false); let i = T.length, j = H.length;
    while (i && j) { if (same(T[i - 1], H[j - 1]) && dp[i][j] === dp[i - 1][j - 1] + 1) { flags[i - 1] = true; i--; j--; } else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--; }
    const ws = T.length ? flags.filter(Boolean).length / T.length : 0;
    const a = norm(target), b = norm(heard), cs = Math.max(0, 1 - lev(a, b) / Math.max(a.length, 1));
    const pct = Math.round(100 * (T.length <= 2 ? Math.max(ws, cs) : 0.8 * ws + 0.2 * cs));
    return { pct, flags, T, heard };
  }
  const band = p => p >= 90 ? ['ممتاز! نطق واضح ومطابق.', 'var(--good)'] : p >= 70 ? ['جيد جداً. استمع للنموذج مرة أخرى لتصل إلى الكمال.', 'var(--accent)'] : p >= 45 ? ['قريب. انطق ببطء ووضوح، وركّز على الكلمات الحمراء.', 'var(--accent)'] : ['لم تتّضح الكلمات. استمع للنموذج ببطء، ثم كرّر مقطعاً مقطعاً.', 'var(--bad)'];
  async function speakView(id, n) {
    const L = await level(id); if (!L) { location.hash = ''; return; }
    const d = L.days.find(x => x.n === n); if (!d) { location.hash = id; return; }
    app.dataset.level = id; markVisited(id, n);
    const words = d.groups.flatMap(g => g.words);
    let mode = store.get('say-mode', 'w'), i = 0, rec = null, chunks = [], myUrl = null;
    const items = () => mode === 'w' ? words.map(w => ({ text: w.w, sub: w.m, key: w.w })) : words.map(w => ({ text: w.s, sub: w.w + ' · ' + w.m, key: 's:' + w.w }));
    view.innerHTML = `
      <div class="crumbs"><a href="#">الرئيسية</a><span>›</span><a href="#${id}">${esc(L.meta.name)}</a><span>›</span><a href="#${id}-d${pad(n)}">اليوم ${n}</a><span>›</span><span>تدريب النطق</span></div>
      <div class="dhead"><div class="num"><small>SPEAK</small><b>${pad(n)}</b></div><div><h2>درّب نطقك: ${esc(d.ar)}</h2><div class="en mastery" dir="ltr" id="mst"></div></div></div>
      <div class="tabs" role="group" aria-label="نوع التدريب"><button data-mode="w">الكلمات</button><button data-mode="s">الجمل</button></div>
      <div class="stage" id="stage"></div>`;
    window.scrollTo(0, 0);
    const paintMastery = () => { const m = sayMap(id, n); const all = items(); const k = all.filter(it => (m[it.key] || 0) >= 85).length; $('#mst').textContent = `${k} / ${all.length} mastered (85%+)`; };
    const render = () => {
      const all = items(); const it = all[i]; const m = sayMap(id, n);
      view.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
      paintMastery();
      view.querySelector('#stage').innerHTML = `
        <div class="prog"><span dir="ltr">${i + 1} / ${all.length}</span><span class="bar2"><i style="width:${((i + 1) / all.length) * 100}%"></i></span><span dir="ltr">${m[it.key] ? 'best ' + m[it.key] + '%' : ''}</span></div>
        <p class="qk">١. استمع للنموذج · ٢. اضغط الميكروفون وانطق · ٣. شاهد نتيجتك</p>
        <div class="${mode === 'w' ? 'qbig' : 'qsent'}" style="${mode === 's' ? 'font-weight:700;font-size:20px' : ''}">${esc(it.text)}</div>
        <div class="tr" style="margin-top:4px">${esc(it.sub)}</div>
        <div class="srow">
          <button class="micbtn" id="mic" aria-label="اضغط وانطق">${ICON_MIC}</button>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="m1">${ICON}استمع للنموذج</button><button class="btn" id="m2">${ICON}ببطء</button><button class="btn" id="mine" hidden>${ICON}استمع لصوتك</button></div>
        </div>
        <p class="hint" id="st">${micMode === 'fallback' ? 'سجّل صوتك بالزر أعلاه ثم قارنه بالنموذج.' : 'اضغط زر الميكروفون، وانطق بعد الإشارة.'}</p>
        <div id="res"></div>
        <div class="next"><button class="btn" id="pv" ${i ? '' : 'disabled'}>السابق ›</button><button class="btn primary" id="nv">${i + 1 < all.length ? 'التالي ‹' : 'من البداية'}</button></div>`;
      $('#m1').addEventListener('click', () => play([{ text: it.text }]));
      $('#m2').addEventListener('click', () => play([{ text: it.text, rate: 0.7 }]));
      $('#pv').addEventListener('click', () => { if (i) { i--; reset(); render(); } });
      $('#nv').addEventListener('click', () => { i = (i + 1) % all.length; reset(); render(); });
      $('#mic').addEventListener('click', () => listen(it));
      if (micMode === 'fallback') fallbackUI(it);
    };
    const reset = () => { stop(); try { if (recog) recog.abort(); } catch (e) {} if (myUrl) { URL.revokeObjectURL(myUrl); myUrl = null; } };
    const saveBest = (it, p) => { const m = sayMap(id, n); if (!m[it.key] || p > m[it.key]) { m[it.key] = p; store.set(`say-${id}-${n}`, JSON.stringify(m)); } paintMastery(); };
    const showMine = () => { const b = $('#mine'); if (!b || !myUrl) return; b.hidden = false; b.onclick = () => { stop(); try { new Audio(myUrl).play().catch(() => {}); } catch (e) {} }; };
    function fallbackUI(it) {
      const mic = $('#mic');
      mic.outerHTML = `<label class="micbtn filebtn" aria-label="سجّل صوتك">${ICON_MIC}<input type="file" id="rec" accept="audio/*" capture></label>`;
      $('#rec').addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        if (myUrl) URL.revokeObjectURL(myUrl); myUrl = URL.createObjectURL(f); showMine();
        $('#st').textContent = 'استمع لصوتك ثم للنموذج، وقيّم نطقك بصدق:';
        $('#res').innerHTML = `<div class="selfrate"><button class="btn" data-sr="95">مطابق تماماً</button><button class="btn" data-sr="75">قريب جداً</button><button class="btn" data-sr="40">أحتاج تدريباً</button></div>
          <p class="hint">للتقييم الآلي للنطق: افتح المنصّة في Chrome أو Safari واسمح باستخدام الميكروفون عندما يسألك المتصفح.</p>`;
        view.querySelectorAll('[data-sr]').forEach(b => b.addEventListener('click', () => { saveBest(it, +b.dataset.sr); $('#st').textContent = 'تم حفظ تقييمك. انتقل إلى العنصر التالي.'; }));
      });
    }
    async function listen(it) {
      stop();
      const st = $('#st'), mic = $('#mic');
      if ((await ensureMic()) !== 'live') { render(); return; }
      try {
        chunks = []; rec = null;
        if (window.MediaRecorder && micStream) { rec = new MediaRecorder(micStream); rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); }; rec.onstop = () => { if (chunks.length) { if (myUrl) URL.revokeObjectURL(myUrl); myUrl = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'audio/webm' })); showMine(); } }; rec.start(); }
      } catch (e) { rec = null; }
      recog = new SR(); recog.lang = state.accent === 'uk' ? 'en-GB' : 'en-US'; recog.interimResults = false; recog.maxAlternatives = 5; recog.continuous = false;
      mic.classList.add('rec'); st.textContent = 'أنا أستمع… انطق الآن.';
      let done = false; const timer = setTimeout(() => { try { recog.stop(); } catch (e) {} }, 8000);
      const end = () => { clearTimeout(timer); mic.classList.remove('rec'); try { if (rec && rec.state !== 'inactive') rec.stop(); } catch (e) {} };
      recog.onresult = e => {
        done = true; const alts = [...e.results[0]].map(a => a.transcript);
        const best = alts.map(a => scoreOne(it.text, a)).sort((x, y) => y.pct - x.pct)[0];
        const [msg, col] = band(best.pct); saveBest(it, best.pct);
        st.textContent = '';
        $('#res').innerHTML = `<div class="sres"><div class="ring" style="--p:${best.pct};--ring-c:${col}"><span>${best.pct}%</span></div><div>
          <b>${msg}</b><div class="tr" style="margin-top:6px">ما سمعته:</div><div class="heard">${esc(best.heard) || '—'}</div>
          ${best.T.length > 1 ? `<div class="tr" style="margin-top:6px">الكلمات المطلوبة:</div><div class="heard">${best.T.map((t, k) => `<span class="${best.flags[k] ? 'hit' : 'miss'}">${esc(t)}</span>`).join('')}</div>` : ''}</div></div>`;
      };
      recog.onerror = e => { end(); if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { micMode = 'fallback'; closeMic(); render(); return; }
        st.textContent = e.error === 'no-speech' ? 'لم أسمع شيئاً. اقترب من الميكروفون وحاول مرة أخرى.' : 'تعذّر التعرّف على الصوت هذه المرة. حاول مرة أخرى.'; };
      recog.onend = () => { end(); if (!done && st.textContent.startsWith('أنا أستمع')) st.textContent = 'لم أسمع شيئاً واضحاً. حاول مرة أخرى.'; };
      try { recog.start(); } catch (e) { end(); st.textContent = 'تعذّر تشغيل الميكروفون. حاول مرة أخرى.'; }
    }
    view.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; store.set('say-mode', mode); i = 0; reset(); render(); }));
    render();
  }

  /* ---------------- routing: '' | a2 | a2-d05 | a2-d05-quiz | a2-d05-speak | a2-review ---------------- */
  async function route() {
    stop(); closeMic(); if (micMode === 'live') micMode = 'unknown';
    const h = location.hash.replace('#', '');
    try {
      let m;
      if ((m = h.match(/^([a-z]\d)-d(\d{1,2})-quiz$/))) await quizView(m[1], parseInt(m[2], 10));
      else if ((m = h.match(/^([a-z]\d)-d(\d{1,2})-speak$/))) await speakView(m[1], parseInt(m[2], 10));
      else if ((m = h.match(/^([a-z]\d)-review$/))) await reviewView(m[1]);
      else if ((m = h.match(/^([a-z]\d)-d(\d{1,2})$/))) await dayView(m[1], parseInt(m[2], 10));
      else if (/^[a-z]\d$/.test(h)) await levelView(h);
      else await home();
    } catch (e) {
      view.innerHTML = '<div class="err">تعذّر تحميل المحتوى. تحقق من اتصالك بالإنترنت ثم أعد فتح الصفحة.</div>';
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
